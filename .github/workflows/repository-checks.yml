name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hygiene-and-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-repo-hygiene.py
      - run: python3 -m unittest discover -s CompatibilitySuite -p 'test_*.py' -v
      - run: bash -n build-bridge.sh run.sh
